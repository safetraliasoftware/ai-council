appId: com.aicouncil.desktop
productName: AI Council
electronVersion: 38.8.6
publish:
  provider: github
  owner: safetraliasoftware
  repo: ai-council
  # Publish straight to a real release, not a draft - electron-updater only
  # ever sees non-draft releases, and the default (draft) would need a
  # manual undraft step after every single publish.
  releaseType: release
directories:
  output: dist
  buildResources: build
files:
  - out/**/*
  - package.json
asarUnpack:
  - '**/node_modules/better-sqlite3/**'
win:
  target:
    - nsis
    - portable
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
