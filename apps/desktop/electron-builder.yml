appId: com.aicouncil.desktop
productName: AI Council
electronVersion: 44.4.3
publish:
  provider: github
  owner: safetraliasoftware
  repo: ai-council
  # Publish straight to a real release, not a draft - electron-updater only
  # ever sees non-draft releases, and the default (draft) would need a
  # manual undraft step after every single publish.
  releaseType: release
directories:
  output: dist
  buildResources: build
files:
  - out/**/*
  - package.json
asarUnpack:
  - '**/node_modules/better-sqlite3/**'
win:
  # Electron 44 dropped 32-bit Windows binaries.
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
